<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asistente RAG - Flask</title>
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">Asistente RAG - Evaluación de Respuestas</h2>

    <form method="POST">
        <label class="form-label">Introduce tu pregunta:</label>
        <input type="text" name="pregunta" class="form-control" required>

        <button class="btn btn-primary mt-3">Enviar</button>
    </form>

    {% if respuesta %}
    <div class="card mt-4">
        <div class="card-header fw-bold">Respuesta</div>
        <div class="card-body">
            <p>{{ respuesta }}</p>
        </div>
    </div>

    <div class="mt-3">
        <p class="fw-bold">¿Te ha gustado la respuesta?</p>
        <a href="/valorar/Sí" class="btn btn-success">Sí</a>
        <a href="/valorar/No" class="btn btn-danger">No</a>
    </div>
    {% endif %}

    {% if session.feedback %}
    <div class="alert alert-info mt-3">{{ session.feedback }}</div>
    {% endif %}

</div>

</body>
</html>
