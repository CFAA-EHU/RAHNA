services:
  rag-app:
    build: .
    expose:
      - "8080"
    volumes:
      - ./docker_data:/data
      - ./modelos:/app/modelos

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - rag-app

volumes:
  docker_data:
